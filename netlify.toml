# Netlify hosts the frontend. It cannot host the API: there is no persistent
# Python process, and Netlify Functions cap at 250 MB unzipped while PyTorch
# alone is larger than that. So this deployment serves the interface only, and
# needs the API running elsewhere (Render - see render.yaml).

[build]
  # No `base` key on purpose. When base is set, Netlify resolves `publish`
  # relative to it, and `base = "frontend-v2"` with `publish = "frontend-v2/dist"`
  # quietly becomes frontend-v2/frontend-v2/dist - a deploy that succeeds and
  # publishes nothing. Running from the repo root removes the ambiguity.
  command = "cd frontend-v2 && npm ci && npm run build"
  publish = "frontend-v2/dist"

[build.environment]
  NODE_VERSION = "22"

  # frontend-v2 has NO demo mode - every figure comes from the API. Before the
  # first deploy set, in Netlify's UI (Site configuration -> Environment
  # variables):
  #
  #     VITE_API_BASE = your-api-host.onrender.com
  #
  # It is compiled into the bundle at build time, so changing it needs a
  # redeploy. The API must also allow this site's origin: add the Netlify
  # domain to EXTRA_CORS_ORIGINS on the backend, or every request fails on CORS.

# BrowserRouter serves every route from index.html. Without this, a visitor
# who refreshes on /app/reports asks the CDN for a file that was never built
# and gets a 404 instead of a React route. Must stay last among redirects:
# it matches everything.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so the content can never change under a
# given name and it is safe to cache forever. index.html deliberately is not
# cached this way - it is what points at the current fingerprints.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
